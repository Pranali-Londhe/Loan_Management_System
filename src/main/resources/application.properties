spring.application.name=LoanManagementSystem

# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/loan_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# JPA & Hibernate Table Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Thymeleaf (disable cache during active development so HTML edits show fast)
spring.thymeleaf.cache=false