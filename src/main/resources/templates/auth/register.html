<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Loan Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
<div class="card" style="width: 100%; max-width: 440px; padding: 32px;">
    <h2>Create Account</h2>
    <p style="color: var(--mut); font-size: 14px; margin-bottom: 24px;">Register as a borrower to request loans</p>

    <form th:action="@{/register}" method="post">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">

        <button type="submit" style="width: 100%; margin-top: 8px;">Register Account</button>
    </form>

    <div style="text-align: center; margin-top: 16px; font-size: 14px; color: var(--mut);">
        Already have an account? <a th:href="@{/login}" style="color: var(--ac); text-decoration: none;">Sign in</a>
    </div>
</div>
</body>
</html>
