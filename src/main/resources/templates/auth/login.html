<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Loan Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh;">
<div class="card" style="width: 100%; max-width: 400px; padding: 32px;">
    <h2>Welcome Back</h2>
    <p style="color: var(--mut); font-size: 14px; margin-bottom: 24px;">Log in to access your account</p>

    <div th:if="${param.error}" style="background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;">
        Invalid email or password.
    </div>
    <div th:if="${param.logout}" style="background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px;">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <label for="username">Email Address</label>
        <input type="email" id="username" name="username" required placeholder="name@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">

        <button type="submit" style="width: 100%; margin-top: 8px;">Sign In</button>
    </form>

    <div style="text-align: center; margin-top: 16px; font-size: 14px; color: var(--mut);">
        Don't have an account? <a th:href="@{/register}" style="color: var(--ac); text-decoration: none;">Register here</a>
    </div>
</div>
</body>
</html>
