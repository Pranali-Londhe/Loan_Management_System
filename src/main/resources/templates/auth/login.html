<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Loan Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="card auth-box">
        <h2 style="margin-bottom: 1rem;">Sign In</h2>

        <div th:if="${param.error}" class="alert alert-error">Invalid email or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%;">Login</button>
        </form>

        <p style="margin-top: 1rem; font-size: 0.9rem;">
            New borrower? <a th:href="@{/register}">Create an account</a>
        </p>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
