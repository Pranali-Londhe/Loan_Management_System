<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Loan Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="page-header">
        <h1>Loan #<span th:text="${loan.id}">1</span></h1>
        <span class="badge" th:classappend="'badge-' + ${loan.status}" th:text="${loan.status}">ACTIVE</span>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="grid-cards">
        <div class="card">
            <h3>Principal</h3>
            <div class="stat-value" th:text="${loan.principalAmount}">0.00</div>
        </div>
        <div class="card">
            <h3>Monthly EMI</h3>
            <div class="stat-value" th:text="${loan.monthlyEmi}">0.00</div>
        </div>
        <div class="card">
            <h3>Total Payable</h3>
            <div class="stat-value" th:text="${loan.totalPayable}">0.00</div>
        </div>
        <div class="card">
            <h3>Remaining Balance</h3>
            <div class="stat-value" th:text="${loan.remainingBalance}">0.00</div>
        </div>
    </div>

    <h2 style="margin-bottom: 0.75rem;">Repayment Schedule</h2>
    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Due Date</th>
                <th>Principal</th>
                <th>Interest</th>
                <th>Installment</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${schedules}">
                <td th:text="${item.installmentNumber}">1</td>
                <td th:text="${item.dueDate}">2026-12-25</td>
                <td th:text="${item.principalComponent}">700.00</td>
                <td th:text="${item.interestComponent}">100.00</td>
                <td th:text="${item.installmentAmount}">800.00</td>
                <td th:text="${item.paid} ? 'PAID (' + ${item.paidDate} + ')' : 'UNPAID'">UNPAID</td>
                <td>
                    <form th:if="${!item.paid and loan.status.name() == 'ACTIVE'}"
                          th:action="@{/borrower/loans/{loanId}/installments/{instId}/pay(loanId=${loan.id},instId=${item.id})}"
                          method="post">
                        <button type="submit" class="btn btn-success btn-sm">Pay Installment</button>
                    </form>
                    <span th:if="${item.paid}" style="color: #15803d; font-weight: 600;">Settled</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(schedules)}">
                <td colspan="7" style="text-align: center; color: #64748b;">
                    Repayment schedule will appear once the loan is disbursed.
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
