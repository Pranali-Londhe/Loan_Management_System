<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Apply for Loan - Loan Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<main>
    <div class="card" style="max-width: 600px; margin: 0 auto;">
        <h2>Apply for a Loan</h2>
        <p style="color: var(--mut); font-size: 14px; margin-bottom: 20px;">Provide the required amount and monthly tenure for review.</p>

        <form th:action="@{/borrower/apply}" method="post">
            <label for="amount">Loan Amount ($)</label>
            <input type="number" id="amount" name="amount" required min="1000" step="100" placeholder="10000">

            <label for="tenureMonths">Tenure (Months, 3 to 60)</label>
            <input type="number" id="tenureMonths" name="tenureMonths" required min="3" max="60" placeholder="12">

            <button type="submit" style="width: 100%; margin-top: 8px;">Submit Application</button>
        </form>
    </div>
</main>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
