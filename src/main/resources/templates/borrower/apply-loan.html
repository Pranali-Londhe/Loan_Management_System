<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Apply for Loan</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
    <div class="page-header">
        <h1>Apply for a Loan</h1>
        <a th:href="@{/borrower/loans}" class="btn">View My Loans</a>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

    <div class="card" style="max-width: 620px;">
        <form th:action="@{/borrower/apply}" th:object="${loanRequest}" method="post">
            <div class="form-group">
                <label for="principalAmount">Principal Amount</label>
                <input type="number" step="0.01" id="principalAmount" th:field="*{principalAmount}" required>
                <div class="field-error" th:if="${#fields.hasErrors('principalAmount')}" th:errors="*{principalAmount}"></div>
            </div>

            <div class="form-group">
                <label for="annualInterestRate">Annual Interest Rate (%)</label>
                <input type="number" step="0.01" id="annualInterestRate" th:field="*{annualInterestRate}" required>
                <div class="field-error" th:if="${#fields.hasErrors('annualInterestRate')}" th:errors="*{annualInterestRate}"></div>
            </div>

            <div class="form-group">
                <label for="tenureMonths">Tenure (Months)</label>
                <input type="number" id="tenureMonths" th:field="*{tenureMonths}" required>
                <div class="field-error" th:if="${#fields.hasErrors('tenureMonths')}" th:errors="*{tenureMonths}"></div>
            </div>

            <div class="form-group">
                <label for="purpose">Purpose</label>
                <input type="text" id="purpose" th:field="*{purpose}" placeholder="Home renovation, education, working capital..." required>
                <div class="field-error" th:if="${#fields.hasErrors('purpose')}" th:errors="*{purpose}"></div>
            </div>

            <div class="preview-box">
                <strong>Live EMI Estimate:</strong>
                <p style="margin-top: 0.35rem;">
                    Monthly EMI: <strong id="previewEmi">0.00</strong> &middot;
                    Total Payable: <strong id="previewTotal">0.00</strong>
                </p>
            </div>

            <button type="submit" class="btn">Submit Application</button>
        </form>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script th:src="@{/js/loan-calculator.js}"></script>
</body>
</html>
