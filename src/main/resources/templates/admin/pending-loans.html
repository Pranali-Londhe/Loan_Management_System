<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pending Applications - Loan Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<main>
    <h1>Loan Applications Queue</h1>
    <p style="color: var(--mut); margin-bottom: 24px;">Review pending borrower submissions, approve, reject, or disburse funds.</p>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Amount</th>
                <th>Tenure</th>
                <th>EMI</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${loans == null || loans.empty}">
                <td colspan="6" style="text-align: center; color: var(--mut);">No pending applications found.</td>
            </tr>
            <tr th:each="loan : ${loans}">
                <td th:text="'#' + ${loan.id}">#1</td>
                <td th:text="'$' + ${#numbers.formatDecimal(loan.amount, 0, 'COMMA', 2, 'POINT')}">$10,000.00</td>
                <td th:text="${loan.tenureMonths} + ' mos'">12 mos</td>
                <td th:text="${loan.emi != null ? '$' + #numbers.formatDecimal(loan.emi, 0, 'COMMA', 2, 'POINT') : 'Pending'}">$883.33</td>
                <td>
                    <span class="badge" th:classappend="${loan.status}" th:text="${loan.status}">PENDING</span>
                </td>
                <td>
                    <div style="display: flex; gap: 6px;">
                        <!-- Approve Form -->
                        <form th:if="${loan.status.name() == 'PENDING'}" th:action="@{/admin/loans/{id}/approve(id=${loan.id})}" method="post">
                            <button type="submit" class="btn" style="padding: 4px 8px; font-size: 12px; background: #2e7d32;">Approve</button>
                        </form>
                        <!-- Disburse Form -->
                        <form th:if="${loan.status.name() == 'APPROVED'}" th:action="@{/admin/loans/{id}/disburse(id=${loan.id})}" method="post">
                            <button type="submit" class="btn" style="padding: 4px 8px; font-size: 12px; background: #0288d1;">Disburse</button>
                        </form>
                        <!-- Reject Form -->
                        <form th:if="${loan.status.name() == 'PENDING'}" th:action="@{/admin/loans/{id}/reject(id=${loan.id})}" method="post" style="display: flex; gap: 4px;">
                            <input type="text" name="remark" placeholder="Reason" required style="margin: 0; padding: 4px 8px; font-size: 12px; width: 100px;">
                            <button type="submit" class="btn" style="padding: 4px 8px; font-size: 12px; background: #c62828;">Reject</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
