<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Loan Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="fragments/navbar :: navbar"></div>
<main>
    <h1>Admin Dashboard</h1>
    <p style="color: var(--mut); margin-bottom: 24px;">Overview of loan applications, disbursements, and system health.</p>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-bottom: 24px;">
        <div class="card">
            <h3 style="color: var(--mut); font-size: 13px; text-transform: uppercase; margin-bottom: 8px;">Pending Applications</h3>
            <p style="font-size: 28px; font-weight: 500; margin: 0;" th:text="${pendingCount ?: 0}">0</p>
            <div style="margin-top: 16px;">
                <a th:href="@{/admin/loans/pending}" class="btn" style="font-size: 13px; padding: 6px 12px;">Review Queue</a>
            </div>
        </div>
    </div>
</main>
<div th:replace="fragments/footer :: footer"></div>
</body>
</html>
